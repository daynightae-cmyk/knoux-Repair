name: KNOUX Repair CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knoux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json


      - name: Install Web dependencies
        working-directory: web-frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: web-frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check Web frontend
        working-directory: web-frontend
        run: npm run typecheck

      - name: Test Web frontend
        working-directory: web-frontend
        run: npm test

      - name: Build Web frontend
        working-directory: web-frontend
        run: npm run build

      - name: Smoke-test Web gateway and real bridge
        shell: pwsh
        run: ./Tests/Test-WebGateway.ps1


      - name: Verify isolated bridge timeout handling
        shell: pwsh
        run: ./Tests/Test-BridgeTimeout.ps1

      - name: Run Desktop functional suite
        shell: pwsh
        run: ./Tests/Run-Tests.ps1
