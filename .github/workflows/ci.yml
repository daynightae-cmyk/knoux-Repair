name: KNOUX Repair CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knoux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $base = '${{ github.event.pull_request.base.sha }}'
          git fetch --no-tags --depth=1 origin $base
          git diff --check $base HEAD

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install Web dependencies
        working-directory: web-frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: web-frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check Web frontend
        working-directory: web-frontend
        run: npm run typecheck

      - name: Test Web frontend
        working-directory: web-frontend
        run: npm test

      - name: Build Web frontend
        working-directory: web-frontend
        run: npm run build

      - name: Capture Round 1 Developer Tools rendered UI evidence
        working-directory: web-frontend
        run: node scripts/capture-round1-developer.mjs

      - name: Verify all 18 canonical service routes in Edge
        working-directory: web-frontend
        run: node scripts/run-capture-18-services-evidence-ci.mjs

      - name: Capture final visual proof and navigation transition evidence
        working-directory: web-frontend
        run: node scripts/run-capture-final-visual-evidence-ci.mjs

      - name: Capture System Vitality overview and tool-card evidence
        working-directory: web-frontend
        run: node scripts/capture-system-vitality-polish-evidence.mjs

      - name: Capture Recovery and Storage card evidence
        working-directory: web-frontend
        run: node scripts/capture-recovery-storage-polish-evidence.mjs

      - name: Capture Assurance tool-card evidence
        working-directory: web-frontend
        run: node scripts/capture-assurance-polish-evidence.mjs

      - name: Capture Software Library tool-card evidence
        working-directory: web-frontend
        run: node scripts/capture-software-library-polish-evidence.mjs

      - name: Capture Mission 02 private MCP evidence
        working-directory: web-frontend
        run: node scripts/capture-mission02-evidence.mjs

      - name: Upload rendered UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knoux-rendered-ui-${{ github.sha }}
          path: web-frontend/visual-evidence
          if-no-files-found: error

      - name: Smoke-test Web gateway and real bridge
        shell: pwsh
        run: ./Tests/Test-WebGateway.ps1

      - name: Verify isolated bridge timeout handling
        shell: pwsh
        run: ./Tests/Test-BridgeTimeout.ps1

      - name: Run Desktop functional suite
        shell: pwsh
        run: ./Tests/Run-Tests.ps1
